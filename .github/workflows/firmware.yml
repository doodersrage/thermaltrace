name: Firmware

# Compile check only. The published images in public/firmware/ are built
# locally with `pnpm firmware:build` and committed.
on:
  pull_request:
    paths:
      - "firmware/**"
      - "scripts/build-firmware.mjs"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/build-firmware.mjs"
      - ".github/workflows/firmware.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/thermaltrace-probe/platformio.ini') }}

      - run: pip install platformio

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compile for ESP32, ESP32-S3, ESP32-C3
        run: node scripts/build-firmware.mjs --check

; Generic ThermalTrace probe firmware for the browser flasher (/flash).
; One binary per chip family; Wi-Fi and the device key are set after flashing,
; over USB from the flasher page or through the "ThermalTrace-Setup" portal.
;
; Build and publish the binaries: node scripts/build-firmware.mjs

[platformio]
default_envs = esp32, esp32s3, esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DONE_WIRE_PIN=4

[env:esp32]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DRESET_PIN=0

[env:esp32s3]
board = esp32-s3-devkitc-1
; The DevKitC default assumes 8 MB flash; build for 4 MB so smaller modules boot too.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DRESET_PIN=0

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
  ${env.build_flags}
  -DRESET_PIN=9
